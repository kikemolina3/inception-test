name: Test inception.sh on macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-test:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker on macOS
        uses: douglascamata/setup-docker-macos-action@v1.0.1
        with:
          lima: v1.2.1
          colima: v0.9.1

      - name: Verify Docker
        run: docker info

      - name: Run inception.sh
        run: |
          chmod +x install/inception.sh
          bash install/inception.sh --skip-datasets

      - name: Verify MinIO containers
        run: |
          docker ps | grep minio1
          docker ps | grep minio2
          curl -sf http://localhost:9000/minio/health/live

      - name: Verify MinIO buckets
        run: |
          mc alias set minio1 http://localhost:9000 minioadmin minioadmin
          mc ls minio1/astronomics-test

      - name: Verify Minikube
        run: minikube status

      - name: Verify Lithops config
        run: |
          cat ~/.lithops/config
          grep "backend: k8s" ~/.lithops/config
          grep "storage: minio" ~/.lithops/config

      - name: Verify Python venv
        run: |
          source install/.venv/bin/activate
          python --version
          pip list

      - name: Cleanup
        if: always()
        run: |
          minikube delete 2>/dev/null || true
          docker stop minio1 minio2 2>/dev/null || true
          docker rm minio1 minio2 2>/dev/null || true
