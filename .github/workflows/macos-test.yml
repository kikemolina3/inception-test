name: Test inception.sh on macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  macos-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test argument parsing
        run: |
          chmod +x install/inception.sh
          # Should fail with usage message when no args
          if bash install/inception.sh 2>&1; then
            echo "Should have failed" && exit 1
          fi
          # Should fail with invalid --os
          if bash install/inception.sh --os windows --skip-datasets 2>&1; then
            echo "Should have rejected invalid OS" && exit 1
          fi

      - name: Install Python 3.10 via Homebrew
        run: |
          brew install python@3.10 || brew upgrade python@3.10 || true
          brew link python@3.10 --overwrite --force 2>/dev/null || true
          python3.10 --version

      - name: Install mc via Homebrew
        run: |
          brew install minio/stable/mc 2>/dev/null || true
          mc --version

      - name: Install minikube via Homebrew
        run: |
          brew install minikube 2>/dev/null || true
          minikube version

      - name: Test venv creation and pip install
        run: |
          BREW_PREFIX="$(brew --prefix python@3.10)"
          PYTHON="${BREW_PREFIX}/bin/python3.10"
          $PYTHON -m venv install/.venv
          source install/.venv/bin/activate
          pip install --upgrade pip
          pip install -e .
          python --version
          pip list

      - name: Test Lithops config generation
        run: |
          mkdir -p ~/.lithops
          MINIO_URL="http://minio1:9000"
          GITLAB_USER="ci"
          GITLAB_PASSWORD="ci"
          cat > ~/.lithops/config << LITHOPS_EOF
          lithops:
            backend: k8s
            storage: minio
            monitoring_interval: 1
          minio:
            bucket_name: flexecutor-demo
            endpoint: ${MINIO_URL}
            access_key_id: minioadmin
            secret_access_key: minioadmin
          k8s:
            docker_server: registry.gitlab.bsc.es
            runtime_timeout: 18000
            docker_user: ${GITLAB_USER}
            namespace: taska-c
            docker_password: ${GITLAB_PASSWORD}
          LITHOPS_EOF
          cat ~/.lithops/config
          grep "backend: k8s" ~/.lithops/config
          grep "storage: minio" ~/.lithops/config

      - name: Test Lithops config backup logic
        run: |
          # Running again should create a backup
          cp ~/.lithops/config ~/.lithops/config_test
          bash -c '
            if [ -e ~/.lithops/config ] && [ ! -e ~/.lithops/config.inception.bak ]; then
              mv ~/.lithops/config ~/.lithops/config.inception.bak
            fi
          '
          test -f ~/.lithops/config.inception.bak
          echo "✅ Backup logic works"
